name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro + Pagefind)
        run: npm run build

      # Uses the project-pinned wrangler (package.json) so the deploy matches
      # `npm run deploy` locally. Runtime env vars/secrets are configured in the
      # Cloudflare dashboard (Workers -> Settings -> Variables and Secrets).
      # --keep-vars preserves dashboard plaintext vars (secrets already persist).
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Zaraz `/cdn-cgi/zaraz/s.js` is not a Worker asset — set browser Cache-Control
      # via a Response Header Transform Rule so Lighthouse cache-lifetime audits pass.
      # Requires secret CLOUDFLARE_ZONE_ID and a token with Transform Rules Edit.
      # Skips when ZONE_ID is unset; continues on API permission errors so Worker
      # deploys are not blocked (apply the dashboard rule in that case — see README).
      - name: Ensure Zaraz s.js browser cache header
        continue-on-error: true
        run: |
          if [ -z "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "CLOUDFLARE_ZONE_ID not set — skipping Zaraz cache header rule."
            echo "Add the secret (or create the Response Header Transform in the dashboard)."
            exit 0
          fi
          npm run cf:zaraz-cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

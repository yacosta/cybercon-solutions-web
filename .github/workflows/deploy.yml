name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro + Pagefind)
        run: npm run build

      # Uses the project-pinned wrangler (package.json) so the deploy matches
      # `npm run deploy` locally. Runtime env vars/secrets are configured in the
      # Cloudflare dashboard (Workers -> Settings -> Variables and Secrets).
      # --keep-vars preserves dashboard plaintext vars (secrets already persist).
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Zaraz `/cdn-cgi/zaraz/s.js` is not a Worker asset — set browser Cache-Control
      # via a Response Header Transform Rule so Lighthouse cache-lifetime audits pass.
      # Zone ID for cybercon-solutions.com (not secret). Token needs Transform Rules Edit;
      # continue-on-error so missing permissions do not block Worker deploys.
      - name: Ensure Zaraz s.js browser cache header
        continue-on-error: true
        run: npm run cf:zaraz-cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 41a145bf2688a227f9e321a31055fe19

      # Drop stale HTML/assets at the edge so new Worker deploys are visible
      # immediately (HTML is cacheable with must-revalidate; PoPs can still HIT).
      # Prefer CLOUDFLARE_FLUSH_CACHE (Zone → Cache Purge). continue-on-error so
      # a missing/wrong token does not block Worker deploys.
      - name: Purge Cloudflare edge cache
        continue-on-error: true
        run: npm run cf:purge-cache
        env:
          CLOUDFLARE_FLUSH_CACHE: ${{ secrets.CLOUDFLARE_FLUSH_CACHE || vars.CLOUDFLARE_FLUSH_CACHE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 41a145bf2688a227f9e321a31055fe19

      # Optional: zone Single Redirect for `/?page_id=` (Worker wrapper already 301s).
      # Token needs Zone → Redirect Rules Edit; continue-on-error so missing
      # permissions do not block Worker deploys.
      - name: Ensure WordPress query permalink 301
        continue-on-error: true
        run: npm run cf:wp-query-redirect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 41a145bf2688a227f9e321a31055fe19

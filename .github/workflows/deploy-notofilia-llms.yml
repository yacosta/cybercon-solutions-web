# One-shot: publish Notofilia /llms.txt + /llms-full.txt via shared Cloudflare account.
# Applies a patch onto yacosta/astro-notofilia, builds, and Pages-deploys.
# Source-of-truth merge into astro-notofilia still requires write access to that repo.
name: Deploy Notofilia llms.txt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-notofilia-llms
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy Notofilia llms
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout cybercon (patch assets)
        uses: actions/checkout@v4
        with:
          path: cybercon

      - name: Checkout Notofilia
        uses: actions/checkout@v4
        with:
          repository: yacosta/astro-notofilia
          path: notofilia

      - name: Apply llms.txt patch
        run: |
          set -euo pipefail
          git -C notofilia apply --verbose cybercon/scripts/notofilia-llms/notofilia-llms-txt.patch
          test -f notofilia/public/llms.txt
          test -f notofilia/public/llms-full.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notofilia/package-lock.json

      - name: Install dependencies
        working-directory: notofilia
        run: npm ci

      - name: Build (Astro + Pagefind)
        working-directory: notofilia
        run: npm run build

      - name: Deploy to Cloudflare Pages (notofilia)
        working-directory: notofilia
        run: npx wrangler pages deploy dist --project-name=notofilia --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

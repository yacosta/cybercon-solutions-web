name: Purge Cloudflare cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    name: Purge edge cache
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Purge Cloudflare edge cache
        run: npm run cf:purge-cache
        env:
          CLOUDFLARE_FLUSH_CACHE: ${{ secrets.CLOUDFLARE_FLUSH_CACHE || vars.CLOUDFLARE_FLUSH_CACHE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 41a145bf2688a227f9e321a31055fe19

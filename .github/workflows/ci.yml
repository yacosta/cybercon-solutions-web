name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & validate Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro + Pagefind)
        run: npm run build

      # Bundles the Worker from the Astro build output without contacting
      # Cloudflare, so this validates the deploy config with no credentials.
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

      # Fast, dependency-free regression guards (placeholder copy, security
      # headers, lead-delivery fail-closed behavior). Not a substitute for
      # real e2e/a11y/perf testing — see README "Recommended next steps".
      - name: CI smoke checks
        run: node scripts/ci-smoke-checks.mjs

      # Best-effort dependency audit — informational only, does not block CI.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

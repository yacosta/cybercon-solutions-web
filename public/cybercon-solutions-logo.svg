<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-label="Cybercon Solutions">
  <title>Cybercon Solutions</title>
  <!-- Horizontal lockup: slate C + coral dot + CYBERCON (navy) SOLUTIONS (slate) -->
  <rect width="760" height="160" fill="#FFFFFF"/>
  <g transform="translate(28,20)">
    <path
      d="M 96 20 A 50 50 0 1 0 96 100"
      fill="none"
      stroke="#5A6B7B"
      stroke-width="28"
      stroke-linecap="round"
    />
    <circle cx="104" cy="60" r="14" fill="#C0392B"/>
  </g>
  <text
    x="180"
    y="94"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="42"
    letter-spacing="2"
  >
    <tspan fill="#0F2C4C">CYBERCON</tspan>
    <tspan fill="#5A6B7B"> SOLUTIONS</tspan>
  </text>
</svg>
